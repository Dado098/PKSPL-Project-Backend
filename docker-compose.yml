services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pkspl-app
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - ./src:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "chmod -R 0777 /var/www/html/storage /var/www/html/bootstrap/cache && php-fpm"
    networks:
      - pkspl-network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pkspl-queue
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - ./src:/var/www/html
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "php artisan queue:work --queue=default --tries=3 --timeout=90 --sleep=3"
    networks:
      - pkspl-network

  nginx:
    image: nginx:latest
    container_name: pkspl-nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pkspl-network

  postgres:
    image: postgis/postgis:17-3.5
    container_name: pkspl-postgres
    restart: always
    environment:
      POSTGRES_DB: pkspl
      POSTGRES_USER: pkspl
      POSTGRES_PASSWORD: pkspl123
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - pkspl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkspl -d pkspl"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: pkspl-adminer
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pkspl-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: pkspl-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - pkspl-network

volumes:
  postgres-data:

networks:
  pkspl-network: